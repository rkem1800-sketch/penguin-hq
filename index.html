<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HQ">
  <title>Penguin HQ</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #070a14; --elev: #121626; --elev-2: #1a1f33;
  --ink: #f5f7ff; --soft: #d6dcf0; --muted: #96a0bd;
  --gold: #ffd60a; --teal: #22c7a9; --blue: #3b82f6; --pink: #ff5c8a;
  --line: rgba(150,170,255,0.16);
  --sans: "Outfit", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --serif: "Fraunces", Georgia, serif;
  --tab-h: 70px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
html { background: var(--bg); }
body {
  font-family: var(--sans); color: var(--ink); font-size: 18px; line-height: 1.4;
  background:
    radial-gradient(800px 460px at 0% -10%, rgba(34,199,169,0.22), transparent 60%),
    radial-gradient(800px 480px at 100% 0%, rgba(59,130,246,0.22), transparent 60%),
    radial-gradient(700px 520px at 100% 100%, rgba(124,58,237,0.18), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
.app-header { position: sticky; top: 0; z-index: 20; padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
  background: linear-gradient(to bottom, rgba(7,10,20,0.97) 60%, rgba(7,10,20,0.75) 85%, transparent);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
.header-inner { max-width: 600px; margin: 0 auto; position: relative; padding-right: 50px; display: flex; gap: 12px; align-items: center; }
.header-inner img { width: 50px; height: 50px; border-radius: 14px; box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
.kicker { margin: 0; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--teal); font-weight: 700; }
h1 { font-family: var(--serif); font-weight: 700; font-size: 2rem; letter-spacing: -0.03em; margin: 0; line-height: 1.05; }
.gear { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--elev); display: flex; align-items: center; justify-content: center; color: var(--soft); }
.gear svg { width: 22px; height: 22px; }
.gear .dot { position: absolute; top: 4px; right: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); border: 2px solid var(--bg); }
.gear .dot.on { background: #4ade80; }
.main { padding: 4px 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom)); max-width: 600px; margin: 0 auto; }
.panel { display: none; animation: rise 0.35s ease both; }
.panel.active { display: block; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.sec-h { font-family: var(--serif); font-size: 1.45rem; font-weight: 700; margin: 24px 0 12px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
.sec-h .n { font-family: var(--sans); font-size: 0.8rem; font-weight: 700; color: var(--muted); background: var(--elev); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; }

/* Brief */
.brief { border-radius: 26px; padding: 20px 20px 18px; position: relative; overflow: hidden; margin-top: 8px;
  background: linear-gradient(140deg, #ffb020 0%, #ff5c8a 52%, #7c3aed 100%); color: #fff; box-shadow: 0 16px 40px rgba(255,92,138,0.28); }
.brief::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.14); }
.brief .lbl { font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 800; opacity: 0.92; }
.brief h2 { font-family: var(--serif); font-size: 1.6rem; line-height: 1.15; margin: 6px 0 0; position: relative; z-index: 1; }
.brief ul { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; position: relative; z-index: 1; }
.brief li { background: rgba(0,0,0,0.18); border-radius: 16px; padding: 11px 13px; font-size: 1.08rem; display: flex; gap: 10px; align-items: flex-start; }
.brief li .e { font-size: 1.3rem; line-height: 1.1; }
.brief li a { text-decoration: none; font-weight: 700; font-size: 0.85rem; background: rgba(255,255,255,0.22); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.brief .foot { margin-top: 12px; font-size: 0.85rem; opacity: 0.9; position: relative; z-index: 1; }
.brief button { margin-top: 14px; border: 0; background: #fff; color: #7c3aed; font-weight: 800; border-radius: 14px; padding: 13px 18px; font-size: 1.05rem; position: relative; z-index: 1; }
.brief.empty { background: linear-gradient(140deg, #1e293b, #312e81); box-shadow: none; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { text-decoration: none; border-radius: 20px; padding: 14px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  background: linear-gradient(160deg, var(--c), color-mix(in srgb, var(--c) 55%, #000)); box-shadow: 0 8px 22px color-mix(in srgb, var(--c) 35%, transparent); min-height: 104px; justify-content: center; }
.tile .e { font-size: 2rem; line-height: 1; }
.tile .t { font-weight: 700; font-size: 0.92rem; line-height: 1.15; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); word-break: break-word; }
.tile:active { transform: scale(0.97); }

/* Quick stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.stat { background: var(--elev); border: 1px solid var(--line); border-radius: 18px; padding: 12px; text-align: center; }
.stat b { display: block; font-size: 1.7rem; font-family: var(--serif); }
.stat span { font-size: 0.82rem; color: var(--muted); font-weight: 600; }

/* Search + chips */
.search-wrap { position: relative; margin: 6px 0 12px; }
.search-wrap svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; stroke: var(--muted); fill: none; }
#search { width: 100%; border: 1px solid var(--line); background: rgba(18,22,38,0.92); border-radius: 16px; padding: 15px 14px 15px 46px; font-size: 1.08rem; outline: none; -webkit-appearance: none; }
#search:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(34,199,169,0.2); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 6px; }
.chip { border: 1px solid var(--line); background: var(--elev); border-radius: 999px; padding: 9px 14px; font-size: 0.95rem; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--c, var(--teal)); color: #0b0f1c; border-color: transparent; box-shadow: 0 0 16px color-mix(in srgb, var(--c, var(--teal)) 50%, transparent); }

/* Bot cards */
.area-h { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; font-family: var(--serif); font-size: 1.35rem; font-weight: 700; }
.area-h .bar { width: 6px; height: 26px; border-radius: 4px; background: var(--c); }
.bots { display: grid; gap: 12px; }
.bot { border-radius: 22px; padding: 16px; background: linear-gradient(150deg, color-mix(in srgb, var(--c) 22%, var(--elev)), var(--elev) 65%); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); position: relative; overflow: hidden; }
.bot .top { display: flex; gap: 14px; align-items: center; }
.bot .av { flex: 0 0 auto; width: 58px; height: 58px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 2rem; background: color-mix(in srgb, var(--c) 30%, #0b0f1c); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); }
.bot h3 { margin: 0; font-size: 1.2rem; font-weight: 800; line-height: 1.15; }
.bot .role { margin: 4px 0 0; color: var(--soft); font-size: 1.02rem; }
.bot .badge { display: inline-block; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: rgba(255,255,255,0.08); color: var(--muted); margin-top: 4px; }
.jobs { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.jobs li { font-size: 0.95rem; background: rgba(0,0,0,0.22); border-radius: 12px; padding: 8px 11px; display: flex; gap: 8px; align-items: flex-start; }
.jobs li b { color: var(--c); font-weight: 700; }
.jobs li.paused { opacity: 0.6; }
.jobs .pz { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; background: rgba(255,255,255,0.12); padding: 1px 7px; border-radius: 99px; margin-left: 4px; white-space: nowrap; }
.open-chat { margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 800; font-size: 1.05rem;
  background: var(--c); color: #0b0f1c; border-radius: 14px; padding: 12px; }
.note { color: var(--muted); font-size: 0.85rem; margin: 10px 2px 0; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 1.05rem; }

/* Tasks */
.add-task { background: var(--elev); border: 1px solid var(--line); border-radius: 22px; padding: 14px; display: grid; gap: 10px; }
.add-task input, .add-task select, .field input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 14px; font-size: 1.08rem; outline: none; -webkit-appearance: none; }
.add-task select { background-image: none; }
.btn { border: 0; border-radius: 14px; padding: 14px 18px; font-weight: 800; font-size: 1.08rem; background: linear-gradient(135deg, var(--teal), var(--blue)); color: #fff; box-shadow: 0 8px 22px rgba(59,130,246,0.35); }
.btn:disabled { opacity: 0.6; }
.btn-ghost { border: 1px solid var(--line); background: var(--elev-2); border-radius: 14px; padding: 12px 16px; font-weight: 700; }
.task-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.task { display: flex; gap: 12px; align-items: center; background: var(--elev); border: 1px solid var(--line); border-left: 6px solid var(--c, var(--teal)); border-radius: 18px; padding: 12px 12px 12px 12px; }
.task .tick { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 12px; border: 2px solid var(--c, var(--teal)); background: transparent; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #0b0f1c; }
.task.done .tick { background: var(--c, var(--teal)); }
.task .body { flex: 1; min-width: 0; }
.task .txt { font-size: 1.1rem; font-weight: 600; word-wrap: break-word; }
.task.done .txt { text-decoration: line-through; color: var(--muted); }
.task .who { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
.task .del { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 1.1rem; }
.task .del.sure { background: #e05050; color: #fff; border-color: #e05050; width: auto; padding: 0 10px; font-size: 0.9rem; font-weight: 800; }
.lock { text-align: center; background: linear-gradient(150deg, #1e293b, #172554); border: 1px solid var(--line); border-radius: 24px; padding: 26px 18px; }
.lock .big { font-size: 2.6rem; }
.lock h2 { font-family: var(--serif); margin: 6px 0 6px; }
.lock p { color: var(--soft); margin: 0 0 14px; }
.sync-line { color: var(--muted); font-size: 0.85rem; margin: 10px 2px 0; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around; background: rgba(8,11,22,0.92);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
.tabbar button { flex: 1; border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
.tabbar .ic { font-size: 1.6rem; line-height: 1.1; filter: grayscale(0.7); opacity: 0.8; }
.tabbar button[aria-selected="true"] { color: var(--ink); }
.tabbar button[aria-selected="true"] .ic { filter: none; opacity: 1; transform: scale(1.1); }

/* Sheet */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 640px; margin: 0 auto; max-height: calc(100dvh - 40px); overflow: auto;
  background: linear-gradient(180deg, #1a2036, #0d1120); border-radius: 26px 26px 0 0; border: 1px solid var(--line); padding: 18px 20px calc(28px + env(safe-area-inset-bottom)); }
.sheet h2 { font-family: var(--serif); font-size: 1.8rem; margin: 0 50px 6px 0; }
.sheet .close { position: absolute; right: 14px; top: 14px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--elev); font-size: 1.2rem; }
.sheet p { color: var(--soft); }
.field { margin: 12px 0; }
.field label { display: block; font-weight: 700; margin-bottom: 6px; }
.err { color: #fca5a5; min-height: 1.2em; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
[hidden] { display: none !important; }
  /* ---- v3: board, workspaces, activity ---- */
.tabbar button { font-size: 11px; }
.hello { font-family: var(--serif); font-size: 1.5rem; margin: 6px 2px 0; }
.panel-box { background: var(--elev); border: 1px solid var(--line); border-radius: 22px; padding: 14px; }
.needs { border-radius: 22px; padding: 16px; margin-top: 14px; background: linear-gradient(150deg, rgba(244,114,182,0.22), var(--elev) 70%); border: 1px solid rgba(244,114,182,0.4); }
.needs h3 { margin: 0 0 10px; font-size: 1.25rem; display: flex; gap: 8px; align-items: center; }
.needs .item { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: rgba(0,0,0,0.25); border-radius: 14px; padding: 12px; margin-top: 8px; color: inherit; }
.needs .item .t { flex: 1; font-weight: 600; font-size: 1.02rem; }
.needs .item .k { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 99px; background: var(--c, #f472b6); color: #0b0f1c; white-space: nowrap; }
.needs .none { color: var(--soft); margin: 0; }
.wsgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.wscard { text-align: left; border: 0; border-radius: 22px; padding: 16px 14px; color: #fff; min-height: 128px; display: flex; flex-direction: column; gap: 4px;
  background: linear-gradient(150deg, var(--c), color-mix(in srgb, var(--c) 45%, #000)); box-shadow: 0 10px 26px color-mix(in srgb, var(--c) 30%, transparent); }
.wscard .e { font-size: 1.8rem; }
.wscard .n { font-weight: 800; font-size: 1.08rem; line-height: 1.15; }
.wscard .c { font-family: var(--serif); font-size: 2rem; font-weight: 700; margin-top: auto; line-height: 1; }
.wscard .s { font-size: 0.82rem; opacity: 0.92; font-weight: 600; }
.wscard.big { min-height: 150px; }
.toolbar { display: flex; gap: 8px; align-items: center; margin: 4px 0 10px; }
.toolbar input[type=search], .toolbar select, .inp { flex: 1; min-width: 0; border: 1px solid var(--line); background: rgba(18,22,38,0.92); border-radius: 14px; padding: 13px 14px; font-size: 1.02rem; outline: none; -webkit-appearance: none; color: var(--ink); }
.add-btn { flex: 0 0 auto; border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 800; font-size: 1.02rem; color: #fff; background: linear-gradient(135deg, var(--teal), var(--blue)); }
.cols { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; margin-bottom: 4px; scrollbar-width: none; }
.cols::-webkit-scrollbar { display: none; }
.col-tab { flex: 0 0 auto; border: 2px solid var(--c); background: transparent; color: var(--ink); border-radius: 16px; padding: 9px 13px; font-weight: 800; font-size: 0.98rem; }
.col-tab .k { display: inline-block; min-width: 24px; margin-left: 6px; padding: 1px 7px; border-radius: 99px; background: var(--c); color: #0b0f1c; font-size: 0.85rem; }
.col-tab[aria-pressed="true"] { background: var(--c); color: #0b0f1c; }
.col-tab[aria-pressed="true"] .k { background: #0b0f1c; color: var(--c); }
.col-hint { color: var(--muted); font-size: 0.88rem; margin: 0 2px 10px; }
.kcards { display: grid; gap: 10px; }
.kcard { background: var(--elev); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 18px; padding: 12px 12px 10px; }
.kcard .main-tap { border: 0; background: transparent; color: inherit; text-align: left; width: 100%; padding: 0; }
.kcard .ttl { font-size: 1.12rem; font-weight: 700; line-height: 1.25; word-wrap: break-word; }
.kcard .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; font-size: 0.88rem; color: var(--soft); }
.kcard .notes { color: var(--muted); font-size: 0.92rem; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 99px; font-size: 0.76rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; background: var(--pc); color: #0b0f1c; }
.pill.soft { background: rgba(255,255,255,0.08); color: var(--soft); text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 0.85rem; }
.pill.late { background: #ef4444; color: #fff; text-transform: none; letter-spacing: 0; }
.mover { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
.mover button { flex: 1; border: 1px solid var(--line); background: var(--elev-2); border-radius: 12px; min-height: 46px; padding: 6px 10px; font-size: 0.98rem; font-weight: 800; color: var(--ink); }
.mover button:disabled { opacity: 0.3; }
.mover .lbl { flex: 1; text-align: center; font-size: 0.85rem; font-weight: 700; color: var(--muted); }
.back { border: 0; background: transparent; color: var(--teal); font-weight: 800; font-size: 1.05rem; padding: 8px 0; }
.ws-title { font-family: var(--serif); font-size: 1.7rem; margin: 2px 0 10px; display: flex; gap: 10px; align-items: center; }
.row-sub { color: var(--soft); font-size: 0.95rem; margin-top: 4px; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.empty-box { text-align: center; border: 2px dashed var(--line); border-radius: 22px; padding: 30px 16px; color: var(--soft); }
.empty-box .big { font-size: 2.4rem; }
.empty-box p { margin: 8px 0 14px; font-size: 1.08rem; }
.act-day { font-size: 0.8rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 800; margin: 16px 2px 8px; }
.act { display: flex; gap: 10px; align-items: flex-start; background: var(--elev); border: 1px solid var(--line); border-radius: 16px; padding: 11px 12px; margin-bottom: 8px; }
.act .ic { font-size: 1.3rem; line-height: 1.2; }
.act .tx { flex: 1; font-size: 1rem; }
.act .tx b { color: var(--teal); }
.act .tm { color: var(--muted); font-size: 0.8rem; white-space: nowrap; }
.more { width: 100%; margin-top: 4px; }
.form-grid { display: grid; gap: 12px; margin-top: 10px; }
.form-grid label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 0.95rem; color: var(--soft); }
.form-grid input, .form-grid select, .form-grid textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 13px; font-size: 1.05rem; outline: none; color: var(--ink); -webkit-appearance: none; }
.form-grid textarea { min-height: 90px; resize: vertical; }
.seg { display: flex; gap: 8px; flex-wrap: wrap; }
.seg button { flex: 1; border: 2px solid var(--pc, var(--line)); background: transparent; border-radius: 12px; padding: 11px 8px; font-weight: 800; color: var(--ink); min-width: 70px; }
.seg button[aria-pressed="true"] { background: var(--pc, var(--teal)); color: #0b0f1c; }
.check { display: flex; gap: 10px; align-items: center; font-weight: 700; }
.check input { width: 26px; height: 26px; }
.danger { border: 1px solid #ef4444; background: transparent; color: #fca5a5; border-radius: 14px; padding: 12px 16px; font-weight: 800; }
.danger.sure { background: #ef4444; color: #fff; }
@media (min-width: 900px) {
  .main { max-width: 1100px; }
  .wsgrid { grid-template-columns: repeat(4, 1fr); }
  .kcards.cols-wide { grid-template-columns: repeat(5, 1fr); align-items: start; }
}
</style>
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <img src="./icon-180.png" alt="">
      <div>
        <p class="kicker">Penguin Air &amp; Plumbing</p>

      </div>
      <button class="gear" id="gear" aria-label="Sign in and settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span class="dot" id="gear-dot"></span>

  <main class="main">
    <section class="panel active" id="p-home">
      <div id="brief"></div>
      <div id="needs"></div>
      <h2 class="sec-h">Workspaces</h2>
      <div class="wsgrid" id="home-ws"></div>
      <h2 class="sec-h">Activity</h2>
      <div id="activity"></div>
      <h2 class="sec-h">Your apps</h2>
      <div class="tiles" id="tiles"></div>
    </section>

    <section class="panel" id="p-board"><div id="board"></div></section>
    <section class="panel" id="p-work"><div id="work"></div></section>

    <section class="panel" id="p-bots">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="Search bots" autocomplete="off" aria-label="Search bots">

  <nav class="tabbar" role="tablist">
    <button role="tab" aria-selected="true" data-tab="home"><span class="ic">🏠</span>Home</button>
    <button role="tab" aria-selected="false" data-tab="board"><span class="ic">✅</span>Board</button>
    <button role="tab" aria-selected="false" data-tab="work"><span class="ic">🗂️</span>Work</button>
    <button role="tab" aria-selected="false" data-tab="bots"><span class="ic">🐧</span>Bots</button>

  <div class="backdrop" id="backdrop" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <button class="close" id="sheet-close" aria-label="Close">✕</button>
    <div id="sheet-body"></div>
  </div>

<script>
(function () {
  "use strict";
  const API = "https://video-library-api.rkem1800.workers.dev";
  // Same PIN as the Video Library. Same site, so a PIN saved there signs you in here too.
  const LS_PIN = "videoLib.pin.v1", LS_SYNCED = "hq.syncedAt.v1", LS_BRIEF = "hq.brief.v1", LS_ACT = "hq.activity.v1";
  const DAY = 86400000, DONE_KEEP = 14 * DAY;
  function load(k, d) { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function safeUrl(u) { return /^(https:\/\/|grokbot:\/\/)/i.test(u || "") ? u : "#"; }
  function uid(p) { return (p || "x") + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function $(id) { return document.getElementById(id); }

  /* ---------- Schemas (labels only, no data) ---------- */
  const STATUSES = [
    { id: "todo", name: "To Do", color: "#38bdf8" }, { id: "doing", name: "In Progress", color: "#fbbf24" },
    { id: "review", name: "For Review", color: "#f472b6" }, { id: "done", name: "Done", color: "#4ade80" },
    { id: "future", name: "Future", color: "#a78bfa" }];
  const PRI = { high: { name: "High", color: "#ef4444" }, med: { name: "Med", color: "#f59e0b" }, low: { name: "Low", color: "#22c55e" } };
  const FLAGS = ["permit", "return visit", "parts", "estimate", "rebate", "photos"];
  const WS = {
    ar: { name: "AR Collections", emoji: "💵", color: "#16a34a", noun: "invoice",
      statuses: [["Not due", "#94a3b8"], ["Due", "#fbbf24"], ["In collection", "#f97316"], ["Paid", "#4ade80"], ["Forgiven", "#a78bfa"], ["Do not contact", "#f87171"]],
      fields: [["customer", "Customer", "text"], ["invoice", "Invoice #", "text"], ["balance", "Balance ($)", "number"], ["due", "Due date", "date"], ["lastContact", "Last contact", "date"], ["note", "Note", "long"]],
      title: function (r) { return r.customer || "Invoice " + (r.invoice || ""); },
      sub: function (r) {
        const out = [];
        if (r.invoice) out.push("#" + esc(r.invoice));
        if (r.balance != null && r.balance !== "") out.push("<b>$" + Number(r.balance).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "</b>");
        if (r.due) { const od = daysOver(r.due); out.push("Due " + fmtDate(r.due) + (od > 0 && ["Paid", "Forgiven"].indexOf(r.status) === -1 ? " · <span class='pill late'>" + od + " days overdue</span>" : "")); }
        if (r.lastContact) out.push("Last contact " + fmtDate(r.lastContact));
        return out.join(" · ");
      }, notes: function (r) { return r.note; } },
    closeout: { name: "Job Closeout", emoji: "🧾", color: "#2563eb", noun: "job",
      statuses: [["Unresolved", "#f97316"], ["Incomplete", "#fbbf24"], ["Closed out", "#4ade80"]],
      fields: [["job", "Job #", "text"], ["customer", "Customer", "text"], ["tech", "Tech", "text"], ["date", "Job date", "date"], ["flags", "Follow-ups", "flags"], ["note", "Note", "long"]],
      title: function (r) { return (r.job ? "Job " + r.job : "Job") + (r.customer ? " · " + r.customer : ""); },
      sub: function (r) { return [r.tech && "👷 " + esc(r.tech), r.date && fmtDate(r.date)].filter(Boolean).join(" · "); }, notes: function (r) { return r.note; } },
    members: { name: "Membership Tracker", emoji: "🎟️", color: "#9333ea", noun: "member",
      statuses: [["Active not due", "#94a3b8"], ["Confirmed due", "#fbbf24"], ["Scheduled", "#38bdf8"], ["Completed", "#4ade80"], ["Expired", "#f87171"]],
      fields: [["customer", "Customer", "text"], ["plan", "Plan", "text"], ["lastVisit", "Last visit", "date"], ["nextDue", "Next due", "date"], ["note", "Note", "long"]],
      title: function (r) { return r.customer || "Member"; },
      sub: function (r) { return [r.plan && esc(r.plan), r.lastVisit && "Last " + fmtDate(r.lastVisit), r.nextDue && "Next " + fmtDate(r.nextDue)].filter(Boolean).join(" · "); }, notes: function (r) { return r.note; } },
    permits: { name: "Permits", emoji: "📜", color: "#ea580c", noun: "permit",
      statuses: [["Not started", "#94a3b8"], ["In progress", "#fbbf24"], ["Submitted", "#38bdf8"], ["Approved", "#4ade80"], ["Closed", "#a78bfa"]],
      fields: [["job", "Job #", "text"], ["customer", "Customer", "text"], ["address", "Address / town", "text"], ["due", "Due date", "date"], ["owner", "Owner", "text"], ["comments", "Comments", "long"]],
      title: function (r) { return (r.job ? "Job " + r.job : "Permit") + (r.customer ? " · " + r.customer : ""); },
      sub: function (r) { return [r.address && "📍 " + esc(r.address), r.due && "Due " + fmtDate(r.due), r.owner && "👤 " + esc(r.owner)].filter(Boolean).join(" · "); }, notes: function (r) { return r.comments; } }
  };
  const WS_ORDER = ["ar", "closeout", "members", "permits"];
  function wsColor(w, status) { const s = WS[w].statuses.find(function (x) { return x[0] === status; }); return s ? s[1] : "#94a3b8"; }

  /* ---------- Dates ---------- */
  function parseD(s) { if (!s) return null; const p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function today0() { const d = new Date(); d.setHours(0, 0, 0, 0); return d; }
  function daysOver(s) { const d = parseD(s); return d ? Math.round((today0() - d) / DAY) : 0; }
  function fmtDate(s) { const d = parseD(s); return d ? d.toLocaleDateString([], { month: "short", day: "numeric", year: d.getFullYear() !== new Date().getFullYear() ? "numeric" : undefined }) : ""; }
  function fmtWhen(ts) { return ts ? new Date(ts).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : ""; }
  function fmtTime(ts) { return new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }

  /* ---------- State ---------- */
  let data = { areas: [], bots: [], links: [] };
  let pin = load(LS_PIN, "") || "";
  let brief = load(LS_BRIEF, null), events = load(LS_ACT, []);
  let syncNote = "", tab = "home", briefState = pin ? "loading" : "locked";
  let boardCol = "todo", boardQ = "", boardBot = "", boardPri = "", wsOpen = "", wsStatus = "", wsQ = "", actShown = 15;
  function makeColl(name, path, list, lsItems, lsTombs) {
    return { name: name, path: path, list: list, lsI: lsItems, lsT: lsTombs, items: load(lsItems, []), tombs: load(lsTombs, []), dirty: load(lsItems + ".dirty", false), timer: null };
  }
  // Tasks keep their old localStorage keys so tasks made before the board carry over.
  const C = { tasks: makeColl("tasks", "/hq/state", "tasks", "hq.tasks.v1", "hq.deleted.v1") };
  WS_ORDER.forEach(function (w) { C[w] = makeColl(w, "/hq/ws/" + w, "rows", "hq.ws." + w + ".v1", "hq.ws." + w + ".del.v1"); });
  function normTask(t) {
    if (!t.status) t.status = t.done ? "done" : "todo";
    t.done = t.status === "done";
    return t;
  }
  C.tasks.items = C.tasks.items.map(normTask);

  function areaOf(id) { return data.areas.find(function (a) { return a.id === id; }) || { name: "", color: "#22c7a9", emoji: "" }; }
  function botOf(id) { return data.bots.find(function (b) { return b.id === id; }); }

  /* ---------- API + sync (same flow as Video Library) ---------- */
  function api(path, opts) {
    opts = opts || {};
    const headers = { "Content-Type": "application/json" };
    const p = opts.pin !== undefined ? opts.pin : pin;
    if (p) headers["X-PIN"] = p;
    return fetch(API + path, { method: opts.method || "GET", headers: headers, body: opts.body ? JSON.stringify(opts.body) : undefined, cache: "no-store" })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j.httpStatus = r.status; return j; }); });
  }
  function signOut(reason) { pin = ""; try { localStorage.removeItem(LS_PIN); } catch (e) {} syncNote = reason || ""; briefState = "locked"; renderAll(); }
  function saveColl(c) { save(c.lsI, c.items); save(c.lsT, c.tombs); save(c.lsI + ".dirty", c.dirty); }
  function adopt(c, st) {
    c.items = (Array.isArray(st[c.list]) ? st[c.list] : []).map(function (x) { return c.name === "tasks" ? normTask(x) : x; });
    c.tombs = Array.isArray(st.deleted) ? st.deleted : []; c.dirty = false; saveColl(c); save(LS_SYNCED, Date.now());
  }
  function persist(c) {
    c.dirty = !!pin; saveColl(c);
    renderAll();
    if (!pin) return;
    if (c.timer) clearTimeout(c.timer);
    c.timer = setTimeout(function () { push(c); }, 700);
  }
  function push(c) {
    c.timer = null;
    if (!pin) return Promise.resolve();
    const body = { deleted: c.tombs }; body[c.list] = c.items;
    return api(c.path, { method: "PUT", body: body }).then(function (j) {
      if (j.ok && j.state) { adopt(c, j.state); syncNote = ""; pullActivity(); }
      else if (j.httpStatus === 401) return signOut("Your PIN stopped working. Sign in again.");
      else syncNote = j.message || ("Sync failed (HTTP " + j.httpStatus + ").");
      renderAll();
    }).catch(function () { syncNote = "Offline. Saved on this phone, will sync later."; renderAll(); });
  }
  function pull(c) {
    if (!pin) return Promise.resolve();
    if (c.dirty) return push(c); // the server merges by item, so a push also brings back other devices' changes
    return api(c.path).then(function (j) {
      if (j.ok && j.state) { adopt(c, j.state); syncNote = ""; }
      else if (j.httpStatus === 401) return signOut("Your PIN stopped working. Sign in again.");
      else if (j.message) syncNote = j.message;
    }).catch(function () { syncNote = "Offline. Showing what's saved on this phone."; });
  }
  function pullBrief() {
    if (!pin) { briefState = "locked"; return Promise.resolve(); }
    return api("/hq/brief").then(function (j) {
      if (j.ok) { brief = j.brief || null; save(LS_BRIEF, brief); briefState = "ok"; }
      else if (j.httpStatus === 401) return signOut("Your PIN stopped working. Sign in again.");
      else briefState = brief ? "ok" : "error";
    }).catch(function () { briefState = brief ? "ok" : "offline"; });
  }
  let actTimer = null;
  function pullActivity() {
    if (!pin) return Promise.resolve();
    if (actTimer) clearTimeout(actTimer);
    return new Promise(function (res) {
      actTimer = setTimeout(function () {
        api("/hq/activity").then(function (j) { if (j.ok) { events = j.events || []; save(LS_ACT, events); renderActivity(); } }).catch(function () {}).then(res);
      }, 300);
    });
  }
  function syncAll() {
    return Promise.all([pullBrief()].concat(Object.keys(C).map(function (k) { return pull(C[k]); }))).then(function () { return pullActivity(); }).then(renderAll);
  }

  /* ---------- Home ---------- */
  function renderBrief() {
    const el = $("brief");
    if (!pin) {
      el.innerHTML = "<div class='brief empty'><div class='lbl'>☀️ Daily brief</div><h2>Sign in to see today's brief and your work</h2><button type='button' data-signin>Enter PIN</button></div>";
    } else if (!brief) {
      const msg = briefState === "loading" ? "Loading…" : briefState === "offline" ? "Offline. Can't load the brief." : "No brief yet";
      el.innerHTML = "<div class='brief empty'><div class='lbl'>☀️ Daily brief</div><h2>" + esc(msg) + "</h2>" +
        (briefState === "ok" ? "<p class='foot'>Your bots will post a short brief here each morning.</p>" : "") + "</div>";
    } else {
      const items = (brief.items || []).map(function (it) {
        const b = it.bot ? botOf(it.bot) : null;
        return "<li><span class='e'>" + esc(it.emoji || "👉") + "</span><span style='flex:1'>" + esc(it.text) + "</span>" + (b ? "<a href='" + esc(b.chat) + "'>" + esc(b.emoji) + " Open</a>" : "") + "</li>";
      }).join("");
      el.innerHTML = "<div class='brief'><div class='lbl'>☀️ " + esc(brief.title || "Daily brief") + (brief.date ? " · " + esc(brief.date) : "") + "</div>" +
        (brief.headline ? "<h2>" + esc(brief.headline) + "</h2>" : "") + (items ? "<ul>" + items + "</ul>" : "") +
        "<p class='foot'>Updated " + esc(fmtWhen(brief.updatedAt)) + (brief.from ? " by " + esc(brief.from) : "") + "</p></div>";
    }
  }
  function renderNeeds() {
    const el = $("needs");
    if (!pin) { el.innerHTML = ""; return; }
    const list = [];
    C.tasks.items.filter(function (t) { return t.status === "review" || (t.needsRK && t.status !== "done"); }).forEach(function (t) {
      list.push("<button class='item' data-edit-task='" + esc(t.id) + "'><span class='t'>" + esc(t.text) + "</span><span class='k' style='--c:#f472b6'>" + (t.status === "review" ? "For review" : "Task") + "</span></button>");
    });
    WS_ORDER.forEach(function (w) {
      C[w].items.filter(function (r) { return r.needsRK; }).forEach(function (r) {
        list.push("<button class='item' data-edit-row='" + w + ":" + esc(r.id) + "'><span class='t'>" + esc(WS[w].emoji + " " + WS[w].title(r)) + "</span><span class='k' style='--c:" + WS[w].color + ";color:#fff'>" + esc(WS[w].name) + "</span></button>");
      });
    });
    el.innerHTML = "<div class='needs'><h3>🙋 Needs you" + (list.length ? " <span class='pill' style='--pc:#f472b6'>" + list.length + "</span>" : "") + "</h3>" +
      (list.length ? list.slice(0, 12).join("") + (list.length > 12 ? "<p class='note'>+" + (list.length - 12) + " more</p>" : "") : "<p class='none'>Nothing needs you right now. 🎉</p>") + "</div>";
  }
  function wsCounts(w) {
    const rows = C[w].items; const by = {};
    rows.forEach(function (r) { by[r.status] = (by[r.status] || 0) + 1; });
    return { n: rows.length, by: by, needs: rows.filter(function (r) { return r.needsRK; }).length };
  }
  function wsCardsHtml(big) {
    return WS_ORDER.map(function (w) {
      const c = wsCounts(w), cfg = WS[w];
      const open = w === "ar" ? (c.by["Due"] || 0) + (c.by["In collection"] || 0) + " to collect" :
        w === "closeout" ? (c.by["Unresolved"] || 0) + (c.by["Incomplete"] || 0) + " open" :
        w === "members" ? (c.by["Confirmed due"] || 0) + " due" : c.n - (c.by["Approved"] || 0) - (c.by["Closed"] || 0) + " open";
      return "<button class='wscard" + (big ? " big" : "") + "' style='--c:" + cfg.color + "' data-ws='" + w + "'><span class='e'>" + cfg.emoji + "</span><span class='n'>" + esc(cfg.name) + "</span>" +
        "<span class='c'>" + (pin ? c.n : "🔒") + "</span><span class='s'>" + (pin ? esc(open) + (c.needs ? " · 🙋 " + c.needs : "") : "Sign in to see") + "</span></button>";
    }).join("");
  }
  function renderHomeWs() { $("home-ws").innerHTML = wsCardsHtml(false); }
  function actIcon(k) { return { move: "➡️", add: "➕", update: "✏️", "delete": "🗑️", brief: "☀️", bot: "🤖" }[k] || "📝"; }
  function dayLabel(ts) {
    const d = new Date(ts); d.setHours(0, 0, 0, 0); const diff = Math.round((today0() - d) / DAY);
    return diff === 0 ? "Today" : diff === 1 ? "Yesterday" : d.toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" });
  }
  function renderActivity() {
    const el = $("activity");
    if (!pin) { el.innerHTML = "<p class='note'>🔒 Sign in to see what got done.</p>"; return; }
    if (!events.length) { el.innerHTML = "<div class='empty-box'><div class='big'>📭</div><p>Nothing yet. Moves, new rows and bot updates show up here.</p></div>"; return; }
    let html = "", last = "";
    events.slice(0, actShown).forEach(function (e) {
      const day = dayLabel(e.ts);
      if (day !== last) { html += "<div class='act-day'>" + esc(day) + "</div>"; last = day; }
      html += "<div class='act'><span class='ic'>" + actIcon(e.kind) + "</span><span class='tx'><b>" + esc(e.by || "RK") + ":</b> " + esc(e.text) + "</span><span class='tm'>" + esc(fmtTime(e.ts)) + "</span></div>";
    });
    if (events.length > actShown) html += "<button class='btn-ghost more' id='act-more'>Show more</button>";
    el.innerHTML = html;
    const m = $("act-more"); if (m) m.addEventListener("click", function () { actShown += 25; renderActivity(); });
  }
  function renderTiles() {
    $("tiles").innerHTML = data.links.map(function (l) {
      return "<a class='tile' style='--c:" + esc(l.color) + "' href='" + esc(safeUrl(l.url)) + "' target='_blank' rel='noopener'><span class='e'>" + esc(l.emoji) + "</span><span class='t'>" + esc(l.name) + "</span></a>";
    }).join("");
  }

  /* ---------- Board ---------- */
  function lockHtml(what) {
    return "<div class='lock'><div class='big'>🔒</div><h2>" + esc(what) + "</h2><p>Sign in with the same PIN as your Video Library.</p><button class='btn' data-signin>Enter PIN</button></div>";
  }
  function visibleTasks() {
    const cut = Date.now() - DONE_KEEP;
    return C.tasks.items.filter(function (t) { return !(t.status === "done" && t.doneAt && t.doneAt < cut); });
  }
  function taskMatches(t) {
    if (boardBot && t.bot !== boardBot) return false;
    if (boardPri && t.priority !== boardPri) return false;
    const q = boardQ.trim().toLowerCase();
    if (q) { const b = botOf(t.bot); if ((t.text + " " + (t.notes || "") + " " + (b ? b.name : "")).toLowerCase().indexOf(q) === -1) return false; }
    return true;
  }
  function stIdx(id) { return STATUSES.findIndex(function (s) { return s.id === id; }); }
  function taskCard(t) {
    const s = STATUSES[stIdx(t.status)] || STATUSES[0], i = stIdx(t.status), b = botOf(t.bot);
    const meta = [];
    if (t.priority) meta.push("<span class='pill' style='--pc:" + PRI[t.priority].color + "'>" + PRI[t.priority].name + "</span>");
    if (t.due) { const od = daysOver(t.due); meta.push(t.status !== "done" && od > 0 ? "<span class='pill late'>📅 " + fmtDate(t.due) + " · late</span>" : "<span class='pill soft'>📅 " + fmtDate(t.due) + "</span>"); }
    meta.push("<span class='pill soft'>" + (b ? esc(b.emoji + " " + b.name) : "🐧 Me / any bot") + "</span>");
    if (t.needsRK) meta.push("<span class='pill' style='--pc:#f472b6'>🙋 Needs you</span>");
    const prev = STATUSES[i - 1], next = STATUSES[i + 1];
    return "<div class='kcard' style='--c:" + s.color + "'><button class='main-tap' data-edit-task='" + esc(t.id) + "'><div class='ttl'>" + esc(t.text) + "</div>" +
      "<div class='meta'>" + meta.join("") + "</div>" + (t.notes ? "<div class='notes'>" + esc(t.notes) + "</div>" : "") + "</button>" +
      "<div class='mover'>" + (prev ? "<button data-move='" + esc(t.id) + "' data-to='" + prev.id + "'>◀ " + esc(prev.name) + "</button>" : "<span class='lbl'></span>") +
      (next ? "<button data-move='" + esc(t.id) + "' data-to='" + next.id + "'>" + esc(next.name) + " ▶</button>" : "<span class='lbl'></span>") + "</button></div></div>";
  }
  function renderBoard() {
    const el = $("board");
    if (!pin) { el.innerHTML = lockHtml("Your task board"); return; }
    const keepFocus = document.activeElement && document.activeElement.id === "board-q";
    const all = visibleTasks(), shown = all.filter(taskMatches);
    const botsUsed = data.bots.filter(function (b) { return all.some(function (t) { return t.bot === b.id; }); });
    let html = "<div class='toolbar'><input type='search' id='board-q' placeholder='Search tasks' value='" + esc(boardQ) + "' aria-label='Search tasks'><button class='add-btn' id='new-task'>＋ Task</button></div>" +
      "<div class='toolbar'><select id='board-bot' aria-label='Filter by bot'><option value=''>All bots</option>" +
      botsUsed.map(function (b) { return "<option value='" + esc(b.id) + "'" + (boardBot === b.id ? " selected" : "") + ">" + esc(b.emoji + " " + b.name) + "</option>"; }).join("") + "</select>" +
      "<select id='board-pri' aria-label='Filter by priority'><option value=''>Any priority</option>" +

  /* ---------- Workspaces ---------- */
  function renderWork() {
    const el = $("work");
    if (!pin) { el.innerHTML = lockHtml("Your workspaces"); return; }
    if (!wsOpen) {
      el.innerHTML = "<p class='col-hint' style='font-size:1rem'>Trackers your bots keep up to date. Tap one to open it.</p><div class='wsgrid'>" + wsCardsHtml(true) + "</div>";
      return;
    }
    const cfg = WS[wsOpen], c = C[wsOpen], counts = wsCounts(wsOpen);
    const keepFocus = document.activeElement && document.activeElement.id === "ws-q";
    const q = wsQ.trim().toLowerCase();
    const shown = c.items.filter(function (r) {
      if (wsStatus === "__needs") { if (!r.needsRK) return false; }
      else if (wsStatus && r.status !== wsStatus) return false;
      if (q) { const hay = cfg.fields.map(function (f) { return Array.isArray(r[f[0]]) ? r[f[0]].join(" ") : r[f[0]]; }).join(" ").toLowerCase(); if (hay.indexOf(q) === -1) return false; }
      return true;
    });
    const closedSt = { Paid: 1, Forgiven: 1, "Do not contact": 1, "Closed out": 1, Completed: 1, Expired: 1, Approved: 1, Closed: 1 };
    if (wsOpen === "ar") shown.sort(function (a, b) { return ((closedSt[a.status] || 0) - (closedSt[b.status] || 0)) || (a.due || "9999").localeCompare(b.due || "9999"); });
    else shown.sort(function (a, b) { return b.updatedAt - a.updatedAt; });
    let html = "<button class='back' id='ws-back'>◀ Workspaces</button><div class='ws-title'>" + cfg.emoji + " " + esc(cfg.name) + "</div>" +
      "<div class='toolbar'><input type='search' id='ws-q' placeholder='Search " + esc(cfg.name) + "' value='" + esc(wsQ) + "'><button class='add-btn' id='ws-add'>＋ Add</button></div>" +
      "<div class='cols'><button class='col-tab' style='--c:#22c7a9' aria-pressed='" + (!wsStatus) + "' data-wss=''>All<span class='k'>" + counts.n + "</span></button>" +
      (counts.needs ? "<button class='col-tab' style='--c:#f472b6' aria-pressed='" + (wsStatus === "__needs") + "' data-wss='__needs'>🙋 Needs you<span class='k'>" + counts.needs + "</span></button>" : "") +
      cfg.statuses.map(function (s) { return "<button class='col-tab' style='--c:" + s[1] + "' aria-pressed='" + (wsStatus === s[0]) + "' data-wss='" + esc(s[0]) + "'>" + esc(s[0]) + "<span class='k'>" + (counts.by[s[0]] || 0) + "</span></button>"; }).join("") + "</div>";
    if (!c.items.length) html += "<div class='empty-box'><div class='big'>" + cfg.emoji + "</div><p>Bots will fill this, or tap ＋ Add.</p><button class='btn' id='ws-add2'>＋ Add " + esc(cfg.noun) + "</button></div>";
    else if (!shown.length) html += "<div class='empty-box'><div class='big'>🔍</div><p>Nothing here" + (q ? " that matches" : "") + ".</p></div>";
    else html += "<div class='kcards'>" + shown.map(function (r) {
      const col = wsColor(wsOpen, r.status), n = cfg.notes(r);
      return "<div class='kcard' style='--c:" + col + "'><button class='main-tap' data-edit-row='" + wsOpen + ":" + esc(r.id) + "'>" +
        "<div class='meta' style='margin-top:0'><span class='pill' style='--pc:" + col + "'>" + esc(r.status) + "</span>" + (r.needsRK ? "<span class='pill' style='--pc:#f472b6'>🙋 Needs you</span>" : "") + "</div>" +
        "<div class='ttl' style='margin-top:8px'>" + esc(cfg.title(r)) + "</div><div class='row-sub'>" + cfg.sub(r) + "</div>" +
        (r.flags && r.flags.length ? "<div class='flags'>" + r.flags.map(function (f) { return "<span class='pill' style='--pc:#fbbf24'>⚑ " + esc(f) + "</span>"; }).join("") + "</div>" : "") +
        (n ? "<div class='notes'>" + esc(n) + "</div>" : "") + "</button></div>";
    }).join("") + "</div>";
    html += "<p class='sync-line'>" + esc(syncNote || ("Synced " + (fmtWhen(load(LS_SYNCED, 0)) || "—"))) + "</p>";
    el.innerHTML = html;
    $("ws-back").addEventListener("click", function () { wsOpen = ""; wsStatus = ""; wsQ = ""; renderWork(); window.scrollTo(0, 0); });
    const qi = $("ws-q"); qi.addEventListener("input", function () { wsQ = qi.value; renderWork(); });
    if (keepFocus) { qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); }
    $("ws-add").addEventListener("click", function () { editRow(wsOpen, null); });
    const a2 = $("ws-add2"); if (a2) a2.addEventListener("click", function () { editRow(wsOpen, null); });
    el.querySelectorAll("[data-wss]").forEach(function (b) { b.addEventListener("click", function () { wsStatus = b.getAttribute("data-wss"); renderWork(); }); });
  }
  function editRow(w, id) {
    const cfg = WS[w], c = C[w];
    const r = id ? c.items.find(function (x) { return x.id === id; }) : null;
    const v = r || { status: wsStatus && wsStatus !== "__needs" ? wsStatus : cfg.statuses[0][0], flags: [] };
    let html = "<h2>" + cfg.emoji + " " + (r ? "Edit " : "Add ") + esc(cfg.noun) + "</h2><div class='form-grid'>" +
      "<div><label for='f-status'>Status</label><select id='f-status'>" + cfg.statuses.map(function (s) { return "<option" + (v.status === s[0] ? " selected" : "") + ">" + esc(s[0]) + "</option>"; }).join("") + "</select></div>";
    cfg.fields.forEach(function (f) {
      const k = f[0], val = v[k];
      if (f[2] === "long") html += "<div><label for='f-" + k + "'>" + esc(f[1]) + "</label><textarea id='f-" + k + "' maxlength='2000'>" + esc(val || "") + "</textarea></div>";
      else if (f[2] === "flags") html += "<div><label>" + esc(f[1]) + "</label><div class='seg' id='f-flags'>" + FLAGS.map(function (fl) {
        return "<button type='button' style='--pc:#fbbf24' data-flag='" + esc(fl) + "' aria-pressed='" + ((val || []).indexOf(fl) !== -1) + "'>" + esc(fl) + "</button>"; }).join("") + "</div></div>";
      else html += "<div><label for='f-" + k + "'>" + esc(f[1]) + "</label><input id='f-" + k + "' type='" + (f[2] === "number" ? "number' step='0.01' inputmode='decimal" : f[2]) + "' value='" + esc(val == null ? "" : val) + "'></div>";
    });
    html += "<label class='check'><input type='checkbox' id='f-needs'" + (v.needsRK ? " checked" : "") + "> 🙋 Needs me</label>" +
      "<div class='btn-row'><button class='btn' id='f-save'>" + (r ? "Save" : "Add") + "</button>" + (r ? "<button class='danger' id='del-btn'>Delete</button>" : "") + "</div><p class='err' id='f-err'></p></div>";

    const fl = $("f-flags");

      obj.updatedAt = now;

      closeSheet(); persist(c);
    });
    deleteButton(function () { c.items = c.items.filter(function (x) { return x.id !== id; }); if (c.tombs.indexOf(id) === -1) c.tombs.push(id); persist(c); });
  }

  /* ---------- Bots ---------- */
  let area = "all", query = "";
  function renderChips() {
    const all = [{ id: "all", name: "All", emoji: "✨", color: "#22c7a9" }].concat(data.areas);
    $("chips").innerHTML = all.map(function (a) {
      return "<button class='chip' style='--c:" + esc(a.color) + "' aria-pressed='" + (area === a.id) + "' data-area='" + esc(a.id) + "'>" + esc(a.emoji) + " " + esc(a.name) + "</button>";
    }).join("");
    document.querySelectorAll("#chips [data-area]").forEach(function (b) { b.addEventListener("click", function () { area = b.getAttribute("data-area"); renderChips(); renderBots(); }); });
  }
  function botCard(b) {
    const a = areaOf(b.area);
    const jobs = (b.jobs || []).map(function (j) {
      return "<li class='" + (j.status === "paused" ? "paused" : "") + "'>⏰<span><b>" + esc(j.when) + ":</b> " + esc(j.what) + (j.status === "paused" ? "<span class='pz'>Paused</span>" : "") + "</span></li>";

      "<p class='role'>" + esc(b.role) + "</p>" + (open ? "<span class='badge'>✅ " + open + " open task" + (open === 1 ? "" : "s") + "</span>" : "") + "</div></div>" +
      (jobs ? "<ul class='jobs'>" + jobs + "</ul>" : "") + "<a class='open-chat' href='" + esc(safeUrl(b.chat)) + "'>💬 Open chat</a></article>";

  function renderBots() {
    const q = query.trim().toLowerCase();

      if (!q) return true;

  /* ---------- Sheet + settings ---------- */
  function openSheet(html) { $("sheet-body").innerHTML = html; $("backdrop").hidden = false; $("sheet").hidden = false; $("sheet").scrollTop = 0; }
  function closeSheet() { $("backdrop").hidden = true; $("sheet").hidden = true; }
  function openSettings() {
    if (pin) {
      openSheet("<h2>Signed in ✅</h2><p>Your board, workspaces, activity and daily brief sync across your devices.</p><p>Last synced: " + esc(fmtWhen(load(LS_SYNCED, 0)) || "never") + "</p>" +
        "<div class='btn-row'><button class='btn' id='sync-now'>🔄 Sync now</button><button class='btn-ghost' id='sign-out'>Sign out</button></div>" +
        "<p class='err' id='acct-err'>" + esc(syncNote) + "</p><p style='font-size:0.9rem;color:var(--muted)'>Same PIN as your Video Library. To change it, use Video Library → gear → Change PIN.</p>");
    } else {
      openSheet("<h2>Sign in with PIN</h2><p>Use the same PIN as your Video Library. Bots and apps show without it. Your board, workspaces and brief need it.</p>" +
        "<div class='field'><label for='pin-in'>PIN</label><input id='pin-in' type='password' inputmode='numeric' autocomplete='current-password' placeholder='Your PIN'></div>" +
        "<div class='btn-row'><button class='btn' id='pin-go'>Sign in</button></div><p class='err' id='acct-err'>" + esc(syncNote) + "</p>");
    }
    const errEl = function (t) { const e = $("acct-err"); if (e) e.textContent = t; };
    const go = $("pin-go");
    if (go) {
      const inp = $("pin-in");
      const doIt = function () {
        const p = inp.value.trim(); if (!p) { errEl("Type your PIN."); return; }
        go.disabled = true; go.textContent = "Checking…";
        api("/hq/state", { pin: p }).then(function (j) {
          go.disabled = false; go.textContent = "Sign in";
          if (j.ok) {
            pin = p; save(LS_PIN, p); syncNote = "";
            // Keep anything made on this device before signing in.
            const server = (j.state && j.state.tasks) || [];
            const extra = C.tasks.items.filter(function (t) { return !server.some(function (s) { return s.id === t.id; }); });
            adopt(C.tasks, j.state || {});
            if (extra.length) { C.tasks.items = C.tasks.items.concat(extra); persist(C.tasks); }
            briefState = "loading"; closeSheet(); renderAll(); syncAll(); return;
          }
          if (j.error === "not_setup") { errEl("No PIN set up yet. Set one up in your Video Library app first."); return; }
          errEl((j.message || "Couldn't sign in.") + (j.triesLeft !== undefined ? " " + j.triesLeft + " tries left." : ""));
        }).catch(function () { go.disabled = false; go.textContent = "Sign in"; errEl("Can't reach the server. Check your connection."); });
      };
      go.addEventListener("click", doIt);
      inp.addEventListener("keydown", function (e) { if (e.key === "Enter") doIt(); });
      setTimeout(function () { inp.focus(); }, 50);
    }
    const sn = $("sync-now");
    if (sn) sn.addEventListener("click", function () { sn.disabled = true; sn.textContent = "Syncing…"; syncAll().then(openSettings); });
    const so = $("sign-out");
    if (so) so.addEventListener("click", function () { signOut(""); closeSheet(); });
  }

  /* ---------- Tabs + global clicks ---------- */
  function showTab(name) {
    tab = name;
    document.querySelectorAll(".tabbar button").forEach(function (b) { b.setAttribute("aria-selected", String(b.getAttribute("data-tab") === name)); });
    document.querySelectorAll(".panel").forEach(function (p) { p.classList.toggle("active", p.id === "p-" + name); });
    $("hdr").textContent = { home: "HQ", board: "Board", work: "Workspaces", bots: "Your bots" }[name];
    window.scrollTo(0, 0);
    try { history.replaceState(null, "", "#" + name + (name === "work" && wsOpen ? "/" + wsOpen : "")); } catch (e) {}
  }
  function renderAll() {
    $("gear-dot").classList.toggle("on", !!pin);
    renderBrief(); renderNeeds(); renderHomeWs(); renderActivity(); renderBoard(); renderWork();
    if (data.bots.length) renderBots();
  }
  document.addEventListener("click", function (e) {
    const s = e.target.closest("[data-signin]"); if (s) { openSettings(); return; }
    const w = e.target.closest("[data-ws]"); if (w) { wsOpen = w.getAttribute("data-ws"); wsStatus = ""; wsQ = ""; showTab("work"); renderWork(); return; }
    const t = e.target.closest("[data-edit-task]"); if (t) { editTask(t.getAttribute("data-edit-task")); return; }
    const r = e.target.closest("[data-edit-row]"); if (r) { const p = r.getAttribute("data-edit-row").split(":"); editRow(p[0], p.slice(1).join(":")); }
  });
  document.querySelectorAll(".tabbar button").forEach(function (b) { b.addEventListener("click", function () { if (b.getAttribute("data-tab") === "work" && tab === "work") { wsOpen = ""; renderWork(); } showTab(b.getAttribute("data-tab")); }); });
  $("gear").addEventListener("click", openSettings);
  $("sheet-close").addEventListener("click", closeSheet);
  $("backdrop").addEventListener("click", closeSheet);
  $("search").addEventListener("input", function (e) { query = e.target.value; renderBots(); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && pin) syncAll(); });
  let wasWide = window.innerWidth >= 900;
  window.addEventListener("resize", function () { const w = window.innerWidth >= 900; if (w !== wasWide) { wasWide = w; renderBoard(); } });

  fetch("./hq.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (d) {
    data = d;
    $("jobs-note").textContent = "⏰ " + (d.jobsNote || "");
    renderTiles(); renderChips(); renderAll();
    const h = (location.hash || "").slice(1).split("/");
    if (h[0] === "work" && WS[h[1]]) wsOpen = h[1];
    if (["home", "board", "work", "bots"].indexOf(h[0]) !== -1) { showTab(h[0]); renderWork(); }
    if (h[0] === "tasks") showTab("board");
    if (pin) syncAll();
  }).catch(function () { $("bot-list").innerHTML = "<p class='empty'>Couldn't load. Pull down to refresh.</p>"; });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function () {});
})();
</script>
</body>
</html>
