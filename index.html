<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070a14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HQ">
  <title>Penguin HQ</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./favicon.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #070a14; --elev: #121626; --elev-2: #1a1f33;
  --ink: #f5f7ff; --soft: #d6dcf0; --muted: #96a0bd;
  --gold: #ffd60a; --teal: #22c7a9; --blue: #3b82f6; --pink: #ff5c8a;
  --line: rgba(150,170,255,0.16);
  --sans: "Outfit", ui-rounded, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --serif: "Fraunces", Georgia, serif;
  --tab-h: 70px;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
html { background: var(--bg); }
body {
  font-family: var(--sans); color: var(--ink); font-size: 18px; line-height: 1.4;
  background:
    radial-gradient(800px 460px at 0% -10%, rgba(34,199,169,0.22), transparent 60%),
    radial-gradient(800px 480px at 100% 0%, rgba(59,130,246,0.22), transparent 60%),
    radial-gradient(700px 520px at 100% 100%, rgba(124,58,237,0.18), transparent 60%),
    var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
a { color: inherit; }
.app-header { position: sticky; top: 0; z-index: 20; padding: calc(10px + env(safe-area-inset-top)) 18px 10px;
  background: linear-gradient(to bottom, rgba(7,10,20,0.97) 60%, rgba(7,10,20,0.75) 85%, transparent);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
.header-inner { max-width: 600px; margin: 0 auto; position: relative; padding-right: 50px; display: flex; gap: 12px; align-items: center; }
.header-inner img { width: 50px; height: 50px; border-radius: 14px; box-shadow: 0 6px 20px rgba(59,130,246,0.4); }
.kicker { margin: 0; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--teal); font-weight: 700; }
h1 { font-family: var(--serif); font-weight: 700; font-size: 2rem; letter-spacing: -0.03em; margin: 0; line-height: 1.05; }
.gear { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--elev); display: flex; align-items: center; justify-content: center; color: var(--soft); }
.gear svg { width: 22px; height: 22px; }
.gear .dot { position: absolute; top: 4px; right: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); border: 2px solid var(--bg); }
.gear .dot.on { background: #4ade80; }
.main { padding: 4px 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom)); max-width: 600px; margin: 0 auto; }
.panel { display: none; animation: rise 0.35s ease both; }
.panel.active { display: block; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.sec-h { font-family: var(--serif); font-size: 1.45rem; font-weight: 700; margin: 24px 0 12px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
.sec-h .n { font-family: var(--sans); font-size: 0.8rem; font-weight: 700; color: var(--muted); background: var(--elev); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; }

/* Brief */
.brief { border-radius: 26px; padding: 20px 20px 18px; position: relative; overflow: hidden; margin-top: 8px;
  background: linear-gradient(140deg, #ffb020 0%, #ff5c8a 52%, #7c3aed 100%); color: #fff; box-shadow: 0 16px 40px rgba(255,92,138,0.28); }
.brief::after { content: ""; position: absolute; right: -60px; top: -60px; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.14); }
.brief .lbl { font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 800; opacity: 0.92; }
.brief h2 { font-family: var(--serif); font-size: 1.6rem; line-height: 1.15; margin: 6px 0 0; position: relative; z-index: 1; }
.brief ul { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; position: relative; z-index: 1; }
.brief li { background: rgba(0,0,0,0.18); border-radius: 16px; padding: 11px 13px; font-size: 1.08rem; display: flex; gap: 10px; align-items: flex-start; }
.brief li .e { font-size: 1.3rem; line-height: 1.1; }
.brief li a { text-decoration: none; font-weight: 700; font-size: 0.85rem; background: rgba(255,255,255,0.22); padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.brief .foot { margin-top: 12px; font-size: 0.85rem; opacity: 0.9; position: relative; z-index: 1; }
.brief button { margin-top: 14px; border: 0; background: #fff; color: #7c3aed; font-weight: 800; border-radius: 14px; padding: 13px 18px; font-size: 1.05rem; position: relative; z-index: 1; }
.brief.empty { background: linear-gradient(140deg, #1e293b, #312e81); box-shadow: none; }

/* Tiles */
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { text-decoration: none; border-radius: 20px; padding: 14px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  background: linear-gradient(160deg, var(--c), color-mix(in srgb, var(--c) 55%, #000)); box-shadow: 0 8px 22px color-mix(in srgb, var(--c) 35%, transparent); min-height: 104px; justify-content: center; }
.tile .e { font-size: 2rem; line-height: 1; }
.tile .t { font-weight: 700; font-size: 0.92rem; line-height: 1.15; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); word-break: break-word; }
.tile:active { transform: scale(0.97); }

/* Quick stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.stat { background: var(--elev); border: 1px solid var(--line); border-radius: 18px; padding: 12px; text-align: center; }
.stat b { display: block; font-size: 1.7rem; font-family: var(--serif); }
.stat span { font-size: 0.82rem; color: var(--muted); font-weight: 600; }

/* Search + chips */
.search-wrap { position: relative; margin: 6px 0 12px; }
.search-wrap svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; stroke: var(--muted); fill: none; }
#search { width: 100%; border: 1px solid var(--line); background: rgba(18,22,38,0.92); border-radius: 16px; padding: 15px 14px 15px 46px; font-size: 1.08rem; outline: none; -webkit-appearance: none; }
#search:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(34,199,169,0.2); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 6px; }
.chip { border: 1px solid var(--line); background: var(--elev); border-radius: 999px; padding: 9px 14px; font-size: 0.95rem; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--c, var(--teal)); color: #0b0f1c; border-color: transparent; box-shadow: 0 0 16px color-mix(in srgb, var(--c, var(--teal)) 50%, transparent); }

/* Bot cards */
.area-h { display: flex; align-items: center; gap: 10px; margin: 22px 0 10px; font-family: var(--serif); font-size: 1.35rem; font-weight: 700; }
.area-h .bar { width: 6px; height: 26px; border-radius: 4px; background: var(--c); }
.bots { display: grid; gap: 12px; }
.bot { border-radius: 22px; padding: 16px; background: linear-gradient(150deg, color-mix(in srgb, var(--c) 22%, var(--elev)), var(--elev) 65%); border: 1px solid color-mix(in srgb, var(--c) 35%, transparent); position: relative; overflow: hidden; }
.bot .top { display: flex; gap: 14px; align-items: center; }
.bot .av { flex: 0 0 auto; width: 58px; height: 58px; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 2rem; background: color-mix(in srgb, var(--c) 30%, #0b0f1c); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); }
.bot h3 { margin: 0; font-size: 1.2rem; font-weight: 800; line-height: 1.15; }
.bot .role { margin: 4px 0 0; color: var(--soft); font-size: 1.02rem; }
.bot .badge { display: inline-block; font-size: 0.7rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: rgba(255,255,255,0.08); color: var(--muted); margin-top: 4px; }
.jobs { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.jobs li { font-size: 0.95rem; background: rgba(0,0,0,0.22); border-radius: 12px; padding: 8px 11px; display: flex; gap: 8px; align-items: flex-start; }
.jobs li b { color: var(--c); font-weight: 700; }
.jobs li.paused { opacity: 0.6; }
.jobs .pz { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; background: rgba(255,255,255,0.12); padding: 1px 7px; border-radius: 99px; margin-left: 4px; white-space: nowrap; }
.open-chat { margin-top: 12px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-weight: 800; font-size: 1.05rem;
  background: var(--c); color: #0b0f1c; border-radius: 14px; padding: 12px; }
.note { color: var(--muted); font-size: 0.85rem; margin: 10px 2px 0; }
.empty { text-align: center; color: var(--muted); padding: 40px 12px; font-size: 1.05rem; }

/* Tasks */
.add-task { background: var(--elev); border: 1px solid var(--line); border-radius: 22px; padding: 14px; display: grid; gap: 10px; }
.add-task input, .add-task select, .field input { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 14px; padding: 14px; font-size: 1.08rem; outline: none; -webkit-appearance: none; }
.add-task select { background-image: none; }
.btn { border: 0; border-radius: 14px; padding: 14px 18px; font-weight: 800; font-size: 1.08rem; background: linear-gradient(135deg, var(--teal), var(--blue)); color: #fff; box-shadow: 0 8px 22px rgba(59,130,246,0.35); }
.btn:disabled { opacity: 0.6; }
.btn-ghost { border: 1px solid var(--line); background: var(--elev-2); border-radius: 14px; padding: 12px 16px; font-weight: 700; }
.task-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 10px; }
.task { display: flex; gap: 12px; align-items: center; background: var(--elev); border: 1px solid var(--line); border-left: 6px solid var(--c, var(--teal)); border-radius: 18px; padding: 12px 12px 12px 12px; }
.task .tick { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 12px; border: 2px solid var(--c, var(--teal)); background: transparent; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; color: #0b0f1c; }
.task.done .tick { background: var(--c, var(--teal)); }
.task .body { flex: 1; min-width: 0; }
.task .txt { font-size: 1.1rem; font-weight: 600; word-wrap: break-word; }
.task.done .txt { text-decoration: line-through; color: var(--muted); }
.task .who { font-size: 0.85rem; color: var(--muted); margin-top: 2px; }
.task .del { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 1.1rem; }
.task .del.sure { background: #e05050; color: #fff; border-color: #e05050; width: auto; padding: 0 10px; font-size: 0.9rem; font-weight: 800; }
.lock { text-align: center; background: linear-gradient(150deg, #1e293b, #172554); border: 1px solid var(--line); border-radius: 24px; padding: 26px 18px; }
.lock .big { font-size: 2.6rem; }
.lock h2 { font-family: var(--serif); margin: 6px 0 6px; }
.lock p { color: var(--soft); margin: 0 0 14px; }
.sync-line { color: var(--muted); font-size: 0.85rem; margin: 10px 2px 0; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: flex; justify-content: space-around; background: rgba(8,11,22,0.92);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
.tabbar button { flex: 1; border: 0; background: transparent; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
.tabbar .ic { font-size: 1.6rem; line-height: 1.1; filter: grayscale(0.7); opacity: 0.8; }
.tabbar button[aria-selected="true"] { color: var(--ink); }
.tabbar button[aria-selected="true"] .ic { filter: none; opacity: 1; transform: scale(1.1); }

/* Sheet */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-width: 640px; margin: 0 auto; max-height: calc(100dvh - 40px); overflow: auto;
  background: linear-gradient(180deg, #1a2036, #0d1120); border-radius: 26px 26px 0 0; border: 1px solid var(--line); padding: 18px 20px calc(28px + env(safe-area-inset-bottom)); }
.sheet h2 { font-family: var(--serif); font-size: 1.8rem; margin: 0 50px 6px 0; }
.sheet .close { position: absolute; right: 14px; top: 14px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--elev); font-size: 1.2rem; }
.sheet p { color: var(--soft); }
.field { margin: 12px 0; }
.field label { display: block; font-weight: 700; margin-bottom: 6px; }
.err { color: #fca5a5; min-height: 1.2em; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
[hidden] { display: none !important; }
  /* ---- v3: board, workspaces, activity ---- */
.tabbar button { font-size: 10.5px; letter-spacing: 0.03em; }
.tabbar .ic { font-size: 1.45rem; }
/* Plan & Expenses */
.fin-jump { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 18px; align-items: center; }
.fin-jump a, .fin-jump button { text-decoration: none; border: 1px solid var(--line); background: var(--elev); border-radius: 99px; padding: 9px 14px; font-size: 0.88rem; font-weight: 700; color: var(--soft); }
.fin-jump .fin-ref { margin-left: auto; }
.fin-sec { margin: 0 0 26px; }
.fin-h { font-family: var(--serif); font-size: 1.45rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fin-src { margin: 0 0 12px; color: var(--muted); font-size: 0.86rem; font-weight: 600; }
.fin-src strong { color: var(--soft); font-weight: 700; }
.fin-card { background: var(--elev); border: 1px solid var(--line); border-left: 6px solid var(--c, var(--teal)); border-radius: 20px; padding: 16px 16px 14px; margin: 0 0 12px; }
.fin-card.wait { border-left-color: var(--muted); background: rgba(18,22,38,0.65); }
.fin-lbl { margin: 0 0 2px; color: var(--muted); font-size: 0.74rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; }
.fin-num { font-family: var(--serif); font-size: 2.05rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; margin: 0; }
.fin-sub { margin: 6px 0 0; color: var(--soft); font-size: 0.94rem; font-weight: 600; }
.fin-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.fin-chip { flex: 0 0 auto; font-size: 0.74rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 99px; padding: 5px 10px; color: #071014; background: #4ade80; }
.fin-chip.behind { background: #fbbf24; }
.fin-chip.done { background: #22c7a9; }
.fin-chip.wait { background: var(--elev-2); color: var(--muted); border: 1px solid var(--line); }
.fin-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fin-qcard { background: var(--elev-2); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.fin-qcard .fin-num { font-size: 1.32rem; }
.fin-bar-wrap { margin-top: 10px; }
.fin-bar { position: relative; height: 16px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; }
.fin-bar > i { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--teal)); width: var(--w); }
.fin-bar.over > i { background: #f87171; }
.fin-tgt { position: absolute; top: -3px; bottom: -3px; width: 3px; background: #fff; border-radius: 2px; left: var(--t); box-shadow: 0 0 0 2px rgba(7,10,20,0.5); }
.fin-tgt-lbl { font-size: 0.76rem; font-weight: 700; color: var(--muted); margin: 6px 0 0; }
.fin-months { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
.fin-mbtn { border: 1px solid var(--line); background: var(--elev); color: var(--soft); border-radius: 99px; padding: 7px 12px; font-size: 0.85rem; font-weight: 700; }
.fin-mbtn[aria-pressed="true"] { background: #a78bfa; color: #071014; border-color: transparent; }
.fin-exp { display: grid; gap: 10px; margin-top: 14px; }
.fin-exp-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: end; margin-bottom: 4px; }
.fin-exp-name { font-weight: 700; font-size: 0.96rem; }
.fin-exp-amt { font-weight: 800; color: var(--ink); font-size: 0.96rem; }
.fin-remind { margin-top: 12px; background: rgba(251,191,36,0.14); border: 1px solid rgba(251,191,36,0.4); border-radius: 14px; padding: 12px 14px; font-weight: 700; font-size: 0.94rem; }
.fin-remind .when { color: #fbbf24; font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase; margin: 0 0 4px; }
.hello { font-family: var(--serif); font-size: 1.5rem; margin: 6px 2px 0; }
.panel-box { background: var(--elev); border: 1px solid var(--line); border-radius: 22px; padding: 14px; }
.needs { border-radius: 22px; padding: 16px; margin-top: 14px; background: linear-gradient(150deg, rgba(244,114,182,0.22), var(--elev) 70%); border: 1px solid rgba(244,114,182,0.4); }
.needs h3 { margin: 0 0 10px; font-size: 1.25rem; display: flex; gap: 8px; align-items: center; }
.needs .item { display: flex; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: rgba(0,0,0,0.25); border-radius: 14px; padding: 12px; margin-top: 8px; color: inherit; }
.needs .item .t { flex: 1; font-weight: 600; font-size: 1.02rem; }
.needs .item .k { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; padding: 3px 8px; border-radius: 99px; background: var(--c, #f472b6); color: #0b0f1c; white-space: nowrap; }
.needs .none { color: var(--soft); margin: 0; }
.wsgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.wscard { text-align: left; border: 0; border-radius: 22px; padding: 16px 14px; color: #fff; min-height: 128px; display: flex; flex-direction: column; gap: 4px;
  background: linear-gradient(150deg, var(--c), color-mix(in srgb, var(--c) 45%, #000)); box-shadow: 0 10px 26px color-mix(in srgb, var(--c) 30%, transparent); }
.wscard .e { font-size: 1.8rem; }
.wscard .n { font-weight: 800; font-size: 1.08rem; line-height: 1.15; }
.wscard .c { font-family: var(--serif); font-size: 2rem; font-weight: 700; margin-top: auto; line-height: 1; }
.wscard .s { font-size: 0.82rem; opacity: 0.92; font-weight: 600; }
.wscard.big { min-height: 150px; }
.toolbar { display: flex; gap: 8px; align-items: center; margin: 4px 0 10px; }
.toolbar input[type=search], .toolbar select, .inp { flex: 1; min-width: 0; border: 1px solid var(--line); background: rgba(18,22,38,0.92); border-radius: 14px; padding: 13px 14px; font-size: 1.02rem; outline: none; -webkit-appearance: none; color: var(--ink); }
.add-btn { flex: 0 0 auto; border: 0; border-radius: 14px; padding: 13px 16px; font-weight: 800; font-size: 1.02rem; color: #fff; background: linear-gradient(135deg, var(--teal), var(--blue)); }
.cols { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; margin-bottom: 4px; scrollbar-width: none; }
.cols::-webkit-scrollbar { display: none; }
.col-tab { flex: 0 0 auto; border: 2px solid var(--c); background: transparent; color: var(--ink); border-radius: 16px; padding: 9px 13px; font-weight: 800; font-size: 0.98rem; }
.col-tab .k { display: inline-block; min-width: 24px; margin-left: 6px; padding: 1px 7px; border-radius: 99px; background: var(--c); color: #0b0f1c; font-size: 0.85rem; }
.col-tab[aria-pressed="true"] { background: var(--c); color: #0b0f1c; }
.col-tab[aria-pressed="true"] .k { background: #0b0f1c; color: var(--c); }
.col-hint { color: var(--muted); font-size: 0.88rem; margin: 0 2px 10px; }
.kcards { display: grid; gap: 10px; }
.kcard { background: var(--elev); border: 1px solid var(--line); border-left: 6px solid var(--c); border-radius: 18px; padding: 12px 12px 10px; }
.kcard .main-tap { border: 0; background: transparent; color: inherit; text-align: left; width: 100%; padding: 0; }
.kcard .ttl { font-size: 1.12rem; font-weight: 700; line-height: 1.25; word-wrap: break-word; }

<script>

  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

    { id: "review", name: "For Review", color: "#f472b6" }, { id: "done", name: "Done", color: "#4ade80" },
    { id: "future", name: "Future", color: "#a78bfa" }];
  const PRI = { high: { name: "High", color: "#ef4444" }, med: { name: "Med", color: "#f59e0b" }, low: { name: "Low", color: "#22c55e" } };
  const FLAGS = ["permit", "return visit", "parts", "estimate", "rebate", "photos"];
  const WS = {
    ar: { name: "AR Collections", emoji: "💵", color: "#16a34a", noun: "invoice",
      statuses: [["Not due", "#94a3b8"], ["Due", "#fbbf24"], ["In collection", "#f97316"], ["Paid", "#4ade80"], ["Forgiven", "#a78bfa"], ["Do not contact", "#f87171"]],

      title: function (r) { return r.customer || "Invoice " + (r.invoice || ""); },

      title: function (r) { return (r.job ? "Job " + r.job : "Job") + (r.customer ? " · " + r.customer : ""); },
      sub: function (r) { return [r.tech && "👷 " + esc(r.tech), r.date && fmtDate(r.date)].filter(Boolean).join(" · "); }, notes: function (r) { return r.note; } },

      title: function (r) { return r.customer || "Member"; },

  function fmtMoney(n) {
    if (n == null || !isFinite(+n)) return "—";
    const v = +n, abs = Math.abs(v), s = v < 0 ? "-" : "";
    if (abs >= 1000000) return s + "$" + (abs / 1000000).toFixed(2) + "M";
    return s + "$" + abs.toLocaleString(undefined, { minimumFractionDigits: abs % 1 ? 2 : 0, maximumFractionDigits: 2 });
  }
  function fmtPct(n) { return (n == null || !isFinite(+n)) ? "—" : (Math.round(+n * 10) / 10) + "%"; }

    return "<span class='fin-chip" + cls + "'>" + txt + "</span>";

      const curM = ms.find(function (m) { return m.month === finMonth; }) || ms[0];
      finMonth = curM.month;
      html += "<p class='fin-src'>From <strong>" + esc(ex.source || ex.by || "QuickBooks Online (read-only)") + "</strong>" + (ex.updatedAt ? " · " + esc(fmtIsoET(new Date(ex.updatedAt).toISOString())) : "") + "</p>";
      if (ms.length > 1) {
        html += "<div class='fin-months'>" + ms.map(function (m) {
          return "<button type='button' class='fin-mbtn' data-fin-m='" + esc(m.month) + "' aria-pressed='" + (m.month === curM.month) + "'>" + esc(m.label || m.month) + "</button>";
        }).join("") + "</div>";
      }
      const cats = (curM.categories || []).slice().sort(function (a, b) { return b.amount - a.amount; });
      const maxAmt = cats.reduce(function (mx, c) { return Math.max(mx, Math.abs(c.amount || 0)); }, 1);
      html += "<div class='fin-card' style='--c:#a78bfa'><p class='fin-lbl'>" + esc(curM.label || curM.month) + " total</p>" +
        "<p class='fin-num'>" + esc(fmtMoney(curM.total)) + "</p>" +
        (curM.operatingTotal != null && curM.otherTotal ? "<p class='fin-sub'>Operating " + esc(fmtMoney(curM.operatingTotal)) + " + Other " + esc(fmtMoney(curM.otherTotal)) + "</p>" : (ex.note ? "<p class='fin-sub'>" + esc(ex.note) + "</p>" : "")) +
        "<div class='fin-exp'>" + cats.map(function (c, i) {
          const w = Math.max(2, Math.min(100, Math.round((Math.abs(c.amount || 0) / maxAmt) * 100)));
          const col = expColors[i % expColors.length];
          return "<div><div class='fin-exp-row'><span class='fin-exp-name'>" + esc(c.name) + "</span><span class='fin-exp-amt'>" + esc(fmtMoney(c.amount)) + "</span></div>" +
            "<div class='fin-bar' style='--c:" + col + ";--w:" + w + "%'><i></i></div></div>";
        }).join("") + "</div></div>";
    }
    html += "</section>";

    // 4. Fixed costs
    html += "<section class='fin-sec' id='fin-lease'><h2 class='fin-h'>Fixed costs</h2>";
    if (!f.fixed || !f.fixed.items || !f.fixed.items.length) {
      html += "<p class='fin-src'>Stored behind your PIN in Worker KV</p>" + finWait("HQ / W - Quinn", "Fixed monthly obligations and renewal reminders will appear here.");
    } else {
      const fx = f.fixed;
      html += "<p class='fin-src'>" + esc(fx.note || "Stored behind your PIN in Worker KV") + "</p>";
      fx.items.forEach(function (it) {
        html += "<div class='fin-card' style='--c:#fb923c'><p class='fin-lbl'>" + esc(it.title) + (it.landlord ? " · " + esc(it.landlord) : "") + "</p>" +
          (it.monthlyTotal != null ? "<p class='fin-num'>" + esc(fmtMoney(it.monthlyTotal)) + "<span style='font-size:1.05rem;font-family:var(--sans);font-weight:700;color:var(--muted)'> / month</span></p>" : "") +
          (it.breakdown ? "<p class='fin-sub'>" + esc(it.breakdown) + "</p>" : "") +
          (it.address ? "<p class='fin-sub' style='color:var(--muted)'>📍 " + esc(it.address) + "</p>" : "") +
          (it.termEnd || it.renewedTo ? "<p class='fin-sub'>" + [it.termEnd, it.renewedTo].filter(Boolean).map(esc).join(" · ") + "</p>" : "") +
          (it.escalation ? "<p class='fin-sub' style='color:var(--muted)'>" + esc(it.escalation) + "</p>" : "") +
          (it.reminderTitle || it.reminderText ? "<div class='fin-remind'>" + (it.reminderTitle ? "<p class='when'>" + esc(it.reminderTitle) + "</p>" : "") + esc(it.reminderText || "") + "</div>" : "") +
          "</div>";
      });
    }
    html += "</section>";

    el.innerHTML = html;
    const rf = $("fin-refresh"); if (rf) rf.addEventListener("click", function () { rf.disabled = true; pullFinance().then(renderFinance); });
    el.querySelectorAll("[data-fin-m]").forEach(function (b) {
      b.addEventListener("click", function () { finMonth = b.getAttribute("data-fin-m"); renderFinance(); });
    });
  }

  /* ---------- Tabs + global clicks ---------- */
  function showTab(name) {
    tab = name;
    document.querySelectorAll(".tabbar button").forEach(function (b) { b.setAttribute("aria-selected", String(b.getAttribute("data-tab") === name)); });
    document.querySelectorAll(".panel").forEach(function (p) { p.classList.toggle("active", p.id === "p-" + name); });
    $("hdr").textContent = { home: "HQ", board: "Board", work: "Workspaces", plan: "Plan & expenses", map: "Map", bots: "Your bots" }[name];
    if (name === "plan" && pin && !fin && finState !== "loading") pullFinance().then(renderFinance);
    try { window.dispatchEvent(new CustomEvent("hq:tab", { detail: name })); } catch (e) {}
    window.scrollTo(0, 0);
    try { history.replaceState(null, "", "#" + name + (name === "work" && wsOpen ? "/" + wsOpen : "")); } catch (e) {}
  }
  function renderAll() {
    $("gear-dot").classList.toggle("on", !!pin);
    renderBrief(); renderNeeds(); renderHomeWs(); renderActivity(); renderBoard(); renderWork(); renderFinance();
    if (data.bots.length) renderBots();
  }
  document.addEventListener("click", function (e) {
    const s = e.target.closest("[data-signin]"); if (s) { openSettings(); return; }
    const gt = e.target.closest("[data-goto-tab]"); if (gt) { showTab(gt.getAttribute("data-goto-tab")); return; }
    const w = e.target.closest("[data-ws]"); if (w) { wsOpen = w.getAttribute("data-ws"); wsStatus = wsOpen === "followups" ? "__open" : ""; sweep.loadedAt = 0; wsQ = ""; showTab("work"); renderWork(); return; }
    const t = e.target.closest("[data-edit-task]"); if (t) { editTask(t.getAttribute("data-edit-task")); return; }
    const r = e.target.closest("[data-edit-row]"); if (r) { const p = r.getAttribute("data-edit-row").split(":"); editRow(p[0], p.slice(1).join(":")); }
  });
  document.querySelectorAll(".tabbar button").forEach(function (b) { b.addEventListener("click", function () { if (b.getAttribute("data-tab") === "work" && tab === "work") { wsOpen = ""; renderWork(); } showTab(b.getAttribute("data-tab")); }); });
  $("gear").addEventListener("click", openSettings);
  $("sheet-close").addEventListener("click", closeSheet);
  $("backdrop").addEventListener("click", closeSheet);
  $("search").addEventListener("input", function (e) { query = e.target.value; renderBots(); });
  document.addEventListener("visibilitychange", function () { if (!document.hidden && pin) { syncAll(); if (wsOpen === "followups") { loadReqs(); loadSweep(); } } });
  let wasWide = window.innerWidth >= 900;
  window.addEventListener("resize", function () { const w = window.innerWidth >= 900; if (w !== wasWide) { wasWide = w; renderBoard(); } });

  fetch("./hq.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (d) {
    data = d;
    $("jobs-note").textContent = "⏰ " + (d.jobsNote || "");
    renderTiles(); renderChips(); renderAll();
    const h = (location.hash || "").slice(1).split("/");
    if (h[0] === "work" && WS[h[1]]) wsOpen = h[1];
    if (["home", "board", "work", "plan", "map", "bots"].indexOf(h[0]) !== -1) { showTab(h[0]); renderWork(); }
    if (h[0] === "tasks") showTab("board");
    if (pin) syncAll();
  }).catch(function () { $("bot-list").innerHTML = "<p class='empty'>Couldn't load. Pull down to refresh.</p>"; });

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function () {});
})();
</script>
<script>
/* Map tab: read-only dispatch map. Board comes from the penguin-dispatch-map Worker (same HQ PIN). Never writes anywhere. */
(function () {
  "use strict";
  const MAP_API = "https://penguin-dispatch-map.rkem1800.workers.dev";
  const LS_PIN = "videoLib.pin.v1";
  const LEAFLET_CSS = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css", LEAFLET_JS = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
  const LEAFLET_CSS_SRI = "sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=", LEAFLET_JS_SRI = "sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=";
  const PALETTE = ["#22c7a9", "#ff5c8a", "#3b82f6", "#fbbf24", "#a78bfa", "#f97316", "#4ade80", "#38bdf8"];
  const STATUS_COLOR = { scheduled: "#38bdf8", dispatched: "#fbbf24", working: "#f97316", done: "#4ade80", hold: "#a78bfa", canceled: "#94a3b8" };
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pin() { try { return JSON.parse(localStorage.getItem(LS_PIN)) || ""; } catch (e) { return ""; } }
  function todayISO() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function fmtET(iso) { try { return new Date(iso).toLocaleString("en-US", { timeZone: "America/New_York", weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " ET"; } catch (e) { return iso || ""; } }
  function fmtMins(m) { m = Math.max(1, Math.round(m)); return m >= 60 ? Math.floor(m / 60) + " h " + (m % 60) + " min" : m + " min"; }
  function stKey(s) { return String(s || "").toLowerCase(); }
  function statusColor(s) { return STATUS_COLOR[stKey(s)] || "#96a0bd"; }

  let L = null, map = null, layers = null, inited = false, loading = false;
  let board = null, loadedDate = "", techs = [], selected = {}, renderToken = 0;
  const routeCache = {};

  function loadLeaflet() {
    if (window.L) return Promise.resolve(window.L);
    return new Promise(function (res, rej) {
      const css = document.createElement("link"); css.rel = "stylesheet"; css.href = LEAFLET_CSS; css.integrity = LEAFLET_CSS_SRI; css.crossOrigin = ""; document.head.appendChild(css);
      const s = document.createElement("script"); s.src = LEAFLET_JS; s.integrity = LEAFLET_JS_SRI; s.crossOrigin = "";
      s.onload = function () { res(window.L); }; s.onerror = function () { rej(new Error("leaflet")); }; document.head.appendChild(s);
    });
  }
  function msg(html) { $("mp-stops").innerHTML = "<div class='mp-msg'>" + html + "</div>"; $("mp-note").textContent = ""; }

  function init() {
    if (inited) { setTimeout(function () { if (map) map.invalidateSize(); }, 60); maybeLoad(); return; }
    inited = true;
    const di = $("mp-date"); di.value = todayISO();
    di.addEventListener("change", function () { load(true); });
    $("mp-reload").addEventListener("click", function () { load(true); });
    msg("Loading map…");
    loadLeaflet().then(function (lf) {
      L = lf;
      map = L.map("mp-map", { zoomControl: true }).setView([35.05, -80.78], 10);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
      layers = L.layerGroup().addTo(map);
      window.addEventListener("resize", function () { map.invalidateSize(); });
      setTimeout(function () { map.invalidateSize(); }, 80);
      load(true);
    }).catch(function () { msg("Couldn't load the map library. Check your connection and reopen the tab."); });
  }
  function maybeLoad() { if (L && (!board || loadedDate !== $("mp-date").value) && !loading) load(true); }

  function load(force) {
    if (!L) return;
    const date = $("mp-date").value || todayISO();
    const p = pin();
    window.__mapTabReady = false;
    if (!p) { board = null; loadedDate = ""; clearMap(); $("mp-chips").innerHTML = ""; $("mp-upd").textContent = ""; $("mp-flags").hidden = true; msg("🔒 Sign in with your HQ PIN to see the dispatch map.<br><br><button class='mp-btn' data-signin>Sign in</button>"); window.__mapTabReady = true; return; }
    loading = true; msg("Loading the board for " + esc(date) + "…");
    fetch(MAP_API + "/dispatch?date=" + encodeURIComponent(date), { headers: { "X-PIN": p }, cache: "no-store" })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { j.httpStatus = r.status; return j; }); })
      .then(function (j) {
        loading = false; loadedDate = date;
        if (j.httpStatus === 200 && j.board) { setBoard(j.board); return; }
        board = null; clearMap(); $("mp-chips").innerHTML = ""; $("mp-flags").hidden = true; $("mp-upd").textContent = "";
        if (j.httpStatus === 404) msg("No board saved for " + esc(date) + " yet.");
        else if (j.httpStatus === 401) msg("🔒 " + esc(j.message || "Sign in with your PIN.") + "<br><br><button class='mp-btn' data-signin>Sign in</button>");
        else msg(esc(j.message || "Couldn't load the board.") + " Try ↻ Reload.");
        window.__mapTabReady = true;
      })
      .catch(function () { loading = false; board = null; clearMap(); msg("Couldn't reach the map server. Try ↻ Reload."); window.__mapTabReady = true; });
  }
  function clearMap() { if (layers) layers.clearLayers(); }

  function setBoard(b) {
    board = b;
    const names = [];
    (b.jobs || []).forEach(function (j) { if (names.indexOf(j.tech) === -1) names.push(j.tech); });
    const shared = {};
    (b.jobs || []).forEach(function (j) { (shared[j.jobNumber] = shared[j.jobNumber] || []).push(j.tech); });
    techs = names.map(function (n, i) {
      const stops = b.jobs.filter(function (j) { return j.tech === n; }).slice().sort(function (a, c) { return String(a.start).localeCompare(String(c.start)); });
      stops.forEach(function (s) { s._with = (shared[s.jobNumber] || []).filter(function (t) { return t !== n; }); });
      return { name: n, color: PALETTE[i % PALETTE.length], idx: i, stops: stops };
    });
    const keep = {}; techs.forEach(function (t) { keep[t.name] = selected[t.name] !== undefined ? selected[t.name] : true; }); selected = keep;
    $("mp-upd").textContent = "Board read from ServiceTitan " + fmtET(b.updatedAt) + " · " + (b.jobs || []).length + " jobs · " + techs.length + " techs";
    const fl = $("mp-flags");
    if (b.notes && b.notes.length) { fl.innerHTML = b.notes.map(function (n) { return "<div>⚠️ " + esc(n) + "</div>"; }).join(""); fl.hidden = false; } else fl.hidden = true;
    renderChips(); render();
  }
  function renderChips() {
    const all = techs.every(function (t) { return selected[t.name]; });
    $("mp-chips").innerHTML = "<button type='button' class='mp-chip' data-mp-all aria-pressed='" + all + "'>All techs</button>" +
      techs.map(function (t) { return "<button type='button' class='mp-chip' data-mp-tech='" + esc(t.name) + "' style='--c:" + t.color + "' aria-pressed='" + !!selected[t.name] + "'><span class='sw'></span>" + esc(t.name) + " · " + t.stops.length + "</button>"; }).join("");
  }
  document.addEventListener("click", function (e) {
    const a = e.target.closest("[data-mp-all]");
    if (a) { techs.forEach(function (t) { selected[t.name] = true; }); renderChips(); render(); return; }
    const c = e.target.closest("[data-mp-tech]");
    if (c) {
      const n = c.getAttribute("data-mp-tech");
      const all = techs.every(function (t) { return selected[t.name]; });
      if (all) techs.forEach(function (t) { selected[t.name] = t.name === n; }); // first tap on a tech = just that tech
      else selected[n] = !selected[n];
      if (!techs.some(function (t) { return selected[t.name]; })) techs.forEach(function (t) { selected[t.name] = true; });
      renderChips(); render(); return;
    }
    const s = e.target.closest("[data-mp-stop]");
    if (s && map) { const m = markers[s.getAttribute("data-mp-stop")]; if (m) { map.setView(m.getLatLng(), Math.max(map.getZoom(), 13)); m.openPopup(); $("mp-map").scrollIntoView({ behavior: "smooth", block: "center" }); } }
  });

  function hav(a, b) { const R = 3958.8, r = Math.PI / 180; const dLa = (b.lat - a.lat) * r, dLo = (b.lng - a.lng) * r; const h = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
  function fallback(pts) { const legs = []; for (let i = 0; i < pts.length - 1; i++) legs.push(hav(pts[i], pts[i + 1]) * 1.4 / 30 * 60); return { line: pts.map(function (p) { return [p.lat, p.lng]; }), legs: legs, source: "straight" }; }
  function osrm(pts) {
    if (pts.length < 2) return Promise.resolve({ line: [], legs: [], source: "none" });
    const key = pts.map(function (p) { return p.lng.toFixed(5) + "," + p.lat.toFixed(5); }).join(";");
    if (routeCache[key]) return Promise.resolve(routeCache[key]);
    const ctrl = new AbortController(); const t = setTimeout(function () { ctrl.abort(); }, 9000);
    return fetch("https://router.project-osrm.org/route/v1/driving/" + key + "?overview=full&geometries=geojson", { signal: ctrl.signal })
      .then(function (r) { if (!r.ok) throw new Error("osrm"); return r.json(); })
      .then(function (d) {
        if (!d || d.code !== "Ok" || !d.routes || !d.routes[0]) throw new Error("osrm");
        const out = { line: d.routes[0].geometry.coordinates.map(function (c) { return [c[1], c[0]]; }), legs: (d.routes[0].legs || []).map(function (l) { return (l.duration || 0) / 60; }), source: "osrm" };
        routeCache[key] = out; return out;
      })
      .catch(function () { return fallback(pts); })
      .finally(function () { clearTimeout(t); });
  }

  let markers = {};
  function pinIcon(n, color, status, off) {
    return L.divIcon({ className: "pin-wrap", html: "<div class='pin-dot " + esc(stKey(status)) + "' style='background:" + color + "'>" + n + "</div>", iconSize: [30, 30], iconAnchor: [15 - off, 15 + off], popupAnchor: [off, -16 - off] });
  }
  function popup(t, s, n) {
    return "<strong>" + esc(t.name) + " · Stop " + n + "</strong><div class='pop-meta'><b>" + esc(s.customer) + "</b><br>Job #" + esc(s.jobNumber) + "<br>" + esc(s.address + ", " + s.city + " " + s.state) +
      "<br>Window: " + esc(s.arrivalWindow) + (s.windowFlag ? " ⚠️" : "") + "<br>" + esc(s.jobType) + "<br>Status: <b style='color:" + statusColor(s.status) + "'>" + esc(s.status) + "</b>" +
      (s._with && s._with.length ? "<br>👥 Shared with " + esc(s._with.join(", ")) : "") + "</div>";
  }
  function render() {
    if (!board || !L) return;
    const token = ++renderToken; window.__mapTabReady = false;
    const list = techs.filter(function (t) { return selected[t.name]; });
    $("mp-note").textContent = "Loading road routes…";
    Promise.all(list.map(function (t) {
      const pts = t.stops.filter(function (s) { return typeof s.lat === "number" && typeof s.lng === "number"; });
      return osrm(pts).then(function (r) { return { t: t, pts: pts, r: r }; });
    })).then(function (res) {
      if (token !== renderToken) return;
      layers.clearLayers(); markers = {};
      const bounds = [], seen = {};
      res.forEach(function (x) {
        if (x.r.line.length) L.polyline(x.r.line, { color: x.t.color, weight: 5, opacity: 0.85, lineJoin: "round" }).addTo(layers);
        x.t.stops.forEach(function (s, i) {
          if (typeof s.lat !== "number") return;
          const k = s.lat.toFixed(5) + "," + s.lng.toFixed(5); const off = (seen[k] = (seen[k] || 0) + 1) - 1;
          const m = L.marker([s.lat, s.lng], { icon: pinIcon(i + 1, x.t.color, s.status, off * 10), zIndexOffset: 100 + i + off * 50 }).addTo(layers).bindPopup(popup(x.t, s, i + 1));
          markers[x.t.idx + ":" + i] = m; bounds.push([s.lat, s.lng]);
        });
      });
      if (bounds.length) map.fitBounds(bounds, { padding: [30, 30], maxZoom: 13 });
      renderSide(res);
      const src = res.map(function (x) { return x.r.source; }).filter(function (s) { return s !== "none"; });
      $("mp-note").textContent = !src.length ? "" : src.every(function (s) { return s === "osrm"; }) ? "Route lines and drive times: public OSRM road routing, in scheduled order." : "Some routes couldn't reach OSRM, so those lines are straight and drive times are rough estimates.";
      setTimeout(function () { map.invalidateSize(); }, 50);
      window.__mapTabReady = true;
    });
  }
  function renderSide(res) {
    let html = "";
    res.forEach(function (x) {
      const t = x.t; const legs = x.r.legs || []; const total = legs.reduce(function (a, b) { return a + b; }, 0);
      html += "<div class='tech-block'><div class='tech-head'><span class='swatch' style='--c:" + t.color + "'></span><span class='tech-name'>" + esc(t.name) + "</span><span class='tech-total'>" + t.stops.length + " stops" + (legs.length ? " · " + fmtMins(total) + " drive" : "") + "</span></div>";
      let li = 0, prevMapped = false;
      t.stops.forEach(function (s, i) {
        const mapped = typeof s.lat === "number";
        if (mapped && prevMapped && legs[li] != null) { html += "<div class='drive' style='--c:" + t.color + "'>Drive " + fmtMins(legs[li]) + "</div>"; li++; }
        if (mapped) prevMapped = true;
        html += "<button type='button' class='stop' data-mp-stop='" + t.idx + ":" + i + "' style='--c:" + t.color + "'><div class='num'>" + (i + 1) + "</div><div><div class='ttl'>" + esc(s.customer) + "</div><div class='meta'>#" + esc(s.jobNumber) + " · " + esc(s.address + ", " + s.city) + "<br>" + esc(s.arrivalWindow) +
          (s.windowFlag ? " <span class='warn'>⚠️ single time in ST</span>" : "") + (s._with && s._with.length ? "<br>👥 with " + esc(s._with.join(", ")) : "") + (mapped ? "" : "<br><span class='warn'>📍 Address not found, not on map</span>") +
          "</div></div><span class='mp-status' style='--sc:" + statusColor(s.status) + "'>" + esc(s.status) + "</span></button>";
      });
      html += "</div>";
    });
    $("mp-stops").innerHTML = html || "<div class='mp-msg'>No techs selected.</div>";
  }

  window.addEventListener("hq:tab", function (e) { if (e.detail === "map") init(); });
  setInterval(function () { const p = $("p-map"); if (inited && L && !board && !loading && pin() && p && p.classList.contains("active") && $("mp-stops").querySelector("[data-signin]")) load(true); }, 1500); // picks up a PIN entered on the sign-in sheet
  document.addEventListener("visibilitychange", function () { if (!document.hidden && inited && document.getElementById("p-map").classList.contains("active")) maybeLoad(); });
})();
</script>
